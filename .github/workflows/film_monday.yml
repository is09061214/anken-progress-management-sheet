name: 撮影予定 月曜朝通知

# 毎週月曜 朝 7:00 JST 頃に「今後 14 日間の撮影予定」を Discord に送る。
# 起動方法（2026-09-01 変更）:
#   GitHub の schedule cron は遅延が大きくなった（数時間遅れる日もある）ため廃止。
#   代わりに Apps Script の時間トリガー（sheet/GitHub朝通知キック.gs）が
#   毎週月曜 6:30 JST 頃に workflow_dispatch でこのワークフローを起動する。
on:
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Japanese font (Noto Sans CJK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt

      - name: Run film notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TIMEZONE: "Asia/Tokyo"
          LOOKAHEAD_DAYS: "14"
          FILMING_KEYWORD: "撮影"
          MENTION_EVERYONE: "True"
        run: python dashboard/scripts/film_notify.py
