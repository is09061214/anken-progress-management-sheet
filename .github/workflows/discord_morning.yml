name: Discord 朝の進捗通知

# 毎朝 7:00 JST 頃に進捗サマリを Discord に送る。
# 起動方法（2026-09-01 変更）:
#   GitHub の schedule cron は遅延が大きくなった（2026-08-26 頃から2〜8時間
#   遅れる日が続出）ため廃止。代わりに Apps Script の時間トリガー
#   （sheet/GitHub朝通知キック.gs）が毎朝 6:30 JST 頃に workflow_dispatch で
#   このワークフローを起動する。dispatch 実行は待ち行列に並ばず数秒で始まる。
# Actions 画面から手動実行して即テストすることもできる。

on:
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Japanese font (Noto Sans CJK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt

      - name: Run Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # 新スプレッドシートは判定済みの「ダッシュボード」タブを名前で指定する。
          # 既定値（app/config.py）も "ダッシュボード" なので、Secret 未設定でも動く。
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          WORKSHEET_GID: ${{ secrets.WORKSHEET_GID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          USE_SAMPLE_DATA: "False"
          TIMEZONE: "Asia/Tokyo"
          # 毎朝の通知では @everyone を発火させてチーム全員に通知する
          MENTION_EVERYONE: "True"
          # ヘッダー検証や WORKSHEET_GID 不一致時の振る舞いは本番と同じ
          FALLBACK_TO_SAMPLE_ON_ERROR: "False"
          FALLBACK_TO_FIRST_SHEET: "False"
        run: python dashboard/scripts/discord_notify.py
